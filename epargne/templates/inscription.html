{% extends "base.html" %}
{% block titre %}Inscription — Cagnotte Voyage{% endblock %}
{% block entete %}{% endblock %}
{% block contenu %}
<div class="page-login">
  <div class="bloc-login">
    <div class="titre-app">
      <span class="emoji">✨</span>
      <h1>Rejoindre l'aventure</h1>
      <p>Crée ton espace personnel de suivi d'épargne.</p>
    </div>

    <div class="carte">
      <form method="post">
        <div class="champ">
          <label for="nom">Ton nom</label>
          <input type="text" id="nom" name="nom" required autofocus>
        </div>
        <div class="champ">
          <label for="email">Ton email</label>
          <input type="email" id="email" name="email" placeholder="toi@exemple.com" required>
          <p class="muted" style="margin-top:6px; margin-bottom:0;">
            On t'envoie ton code d'accès personnel par email.
          </p>
        </div>
        <button type="submit" class="bouton" style="width:100%;">Créer mon espace</button>
      </form>
    </div>

    <div class="lien-coach">
      <a href="{{ url_for('auth.login') }}">← J'ai déjà un compte</a>
    </div>
  </div>
</div>
{% endblock %}
